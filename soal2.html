<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal 2 - Tabel Biru dan Hijau</title>
    <style>
      #warna td {
        border: 1px solid white;
      }
    </style>
  </head>
  <body>
    <table id="warna" border="1" bordercolor="white" cellspacing="0" cellpadding="0">
      <tr>
        <td rowspan="7" width="77" bgcolor="blue"></td>
        <td colspan="3" width="231" height="77" bgcolor="blue"></td>
      </tr>
      <tr>
        <td width="77" height="77" bgcolor="lime"></td>
        <td colspan="2" rowspan="2" bgcolor="lime"></td>
        <td rowspan="2" width="77" bgcolor="blue"></td>
      </tr>
      <tr>
        <td height="77"></td>
      </tr>
      <tr>
        <td height="77" bgcolor="blue"></td>
        <td></td>
        <td bgcolor="blue"></td>
      </tr>
      <tr>
        <td height="77"></td>
      </tr>
      <tr>
        <td height="77"></td>
      </tr>
      <tr>
        <td height="77"></td>
      </tr>
    </table>
  </body>
</html>
